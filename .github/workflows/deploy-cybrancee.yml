name: Deploy to Cybrancee

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Restart Cybrancee Server
    runs-on: ubuntu-latest

    steps:
      - name: Restart Cybrancee server
        uses: fjogeleit/http-request-action@v1.16.3
        with:
          url: "https://panel.cybrancee.com/api/client/servers/${{ vars.SERVER_ID }}/power"
          method: "POST"
          customHeaders: >
            {
              "Accept": "application/json",
              "Content-Type": "application/json",
              "Authorization": "Bearer ${{ secrets.PTERODACTYL_API_KEY }}"
            }
          data: '{"signal":"restart"}'
